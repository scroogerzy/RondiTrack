name: RondiTrack CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RondiTrack.sln

      - name: Build Release
        run: dotnet build RondiTrack.sln --configuration Release --no-restore

      - name: Run all tests
        run: dotnet test RondiTrack.sln --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://127.0.0.1:5076
      SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    defaults:
      run:
        working-directory: web-next
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check generated API types
        run: |
          npm run api:types
          git diff --exit-code -- src/types/api.d.ts

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (UTC)
        run: npm run test:utc

      - name: Unit tests (Johannesburg)
        run: npm run test:sast

      - name: Production build
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser, privacy and axe tests
        run: npm run test:e2e

      - name: Upload Playwright report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            web-next/playwright-report/
            web-next/test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker-image:
    runs-on: ubuntu-latest
    needs: build-test
    env:
      API_BASE_URL: http://127.0.0.1:5076
      SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_RELEASE: ${{ github.sha }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build API Docker image
        run: docker build --tag ronditrack-api:${GITHUB_SHA} .
      - name: Build Next.js Docker image
        run: |
          docker build --file web-next/Dockerfile             --build-arg API_BASE_URL="$API_BASE_URL"             --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL"             --build-arg NEXT_PUBLIC_SENTRY_DSN="$NEXT_PUBLIC_SENTRY_DSN"             --build-arg NEXT_PUBLIC_SENTRY_RELEASE="$NEXT_PUBLIC_SENTRY_RELEASE"             --build-arg SENTRY_ORG="$SENTRY_ORG"             --build-arg SENTRY_PROJECT="$SENTRY_PROJECT"             --build-arg SENTRY_RELEASE="$SENTRY_RELEASE"             --secret id=session_secret,env=SESSION_SECRET             --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN             --tag ronditrack-web:${GITHUB_SHA} web-next

  openapi-contract:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5076
      API_BASE_URL: http://127.0.0.1:5076
      ConnectionStrings__RondiTrack: Host=localhost;Port=5432;Database=ronditrack;Username=ronditrack;Password=ronditrack
      Jwt__SigningKey: CI-only-signing-key-32-bytes-minimum-not-a-production-secret
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: ronditrack
          POSTGRES_USER: ronditrack
          POSTGRES_PASSWORD: ronditrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ronditrack -d ronditrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore RondiTrack.sln
      - name: Build API
        run: dotnet build API/API.csproj --configuration Release --no-restore
      - name: Apply migrations once
        run: dotnet API/bin/Release/net10.0/API.dll --migrate-only
      - name: Start API
        run: |
          nohup dotnet API/bin/Release/net10.0/API.dll > /tmp/ronditrack-api.log 2>&1 &
          echo $! > /tmp/ronditrack-api.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5076/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ronditrack-api.log
          exit 1
      - name: Compare served OpenAPI with committed contract
        run: ./scripts/check-openapi.sh
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - name: Check generated frontend API types
        working-directory: web-next
        run: |
          npm ci
          npm run api:types
          git diff --exit-code -- src/types/api.d.ts
      - name: Stop API
        if: always()
        run: if [ -f /tmp/ronditrack-api.pid ]; then kill "$(cat /tmp/ronditrack-api.pid)" || true; fi
