services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  api:
    image: ronditrack-api:6.4
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RondiTrack: ${ConnectionStrings__RondiTrack:?Set ConnectionStrings__RondiTrack in .env}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in .env}
      CycleClose__IntervalSeconds: ${CycleClose__IntervalSeconds:-60}
      Housekeeping__IntervalSeconds: ${Housekeeping__IntervalSeconds:-3600}
      Housekeeping__RefreshTokenRetentionDays: ${Housekeeping__RefreshTokenRetentionDays:-7}
      Housekeeping__IdempotencyRetentionHours: ${Housekeeping__IdempotencyRetentionHours:-48}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
